aid: internet2
name: Internet2
image: https://internet2.edu/wp-content/uploads/2020/12/comm-internet2-logo-250x190-4.png
description: Internet2 is a nonprofit advanced networking consortium that provides a high‑performance, secure network for research and education
  institutions across the United States. It offers cloud services, identity management, security solutions, and collaborative tools to enable
  innovative research, teaching, and community initiatives. The organization also supports policy development, network engineering, and a range
  of services to its member institutions, fostering a robust digital research ecosystem.
